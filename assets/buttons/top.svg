<svg xmlns="http://www.w3.org/2000/svg" width="200" height="44" viewBox="0 0 200 44" role="img" aria-labelledby="b-top-t b-top-d"><title id="b-top-t">Back to top</title><desc id="b-top-d">Scroll back to the top</desc><style>@font-face{font-family:fmb;font-weight:700;src:url(data:font/woff2;base64,) format('woff2')}.d{font-family:fd,'Arial Narrow',Impact,sans-serif;font-weight:800}.h{font-family:fh,'Arial Narrow',sans-serif;font-weight:700}.s{font-family:fs,'Arial Narrow',sans-serif;font-weight:600}.n{font-family:fn,'Arial Narrow',sans-serif;font-weight:500}.m{font-family:fm,ui-monospace,Menlo,Consolas,monospace;font-weight:400}.mm{font-family:fmm,ui-monospace,Menlo,Consolas,monospace;font-weight:500}.mb{font-family:fmb,ui-monospace,Menlo,Consolas,monospace;font-weight:700} .up{animation:up .9s cubic-bezier(.16,1,.3,1) both} .fade{animation:fade 1s ease both} .blink{animation:blink 1.05s steps(2,end) infinite} .pulse{animation:pulse 2.4s ease-in-out infinite} .float{animation:float 6s ease-in-out infinite} .nudge{animation:nudge 2.8s ease-in-out infinite} .flick{animation:flick 6.5s linear infinite} .tw{animation:tw 3.2s ease-in-out infinite} .sweep{animation:sweep 8s ease-in-out infinite} @keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}} @keyframes fade{from{opacity:0}to{opacity:1}} @keyframes blink{50%{opacity:0}} @keyframes pulse{0%,100%{opacity:1}50%{opacity:.28}} @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}} @keyframes nudge{0%,68%,100%{transform:translateX(0)}84%{transform:translateX(7px)}} @keyframes flick{0%,17%,21%,25%,61%,65%,100%{opacity:1}19%,23%,63%{opacity:.3}} @keyframes tw{0%,100%{opacity:.12}50%{opacity:.9}} @keyframes sweep{0%,32%{transform:translateX(-1700px)}72%,100%{transform:translateX(1700px)}} @media (prefers-reduced-motion:reduce){*{animation:none!important}.motion{display:none}.still{display:inline!important}}</style><defs></defs><rect x="1" y="1" width="198" height="42" rx="22" fill="#0a1328" stroke="#63a6ff" stroke-width="1.2" stroke-opacity=".5"/><text x="90" y="27.5" font-size="12" class="mb" fill="#b9c6e0" letter-spacing="2" text-anchor="middle">BACK TO TOP</text><g class="float" style="animation-duration:2s"><path d="M162 28v-12m-5 5l5 -5l5 5" fill="none" stroke="#22e1ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g></svg>